<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<style>
  html,body{margin:0;padding:0;background:#fff}
  svg{display:block}
</style>
</head>
<body>
<svg id="seal" xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <!-- red band: top arc (upright) and bottom arc (reads around the bottom) -->
    <path id="redTop" d="M 450,450 m -392,0 a 392,392 0 0 1 784,0" fill="none"/>
    <path id="redBot" d="M 450,450 m 390,0 a 390,390 0 0 1 -780,0" fill="none"/>

    <!-- main ring: starts at 6 o'clock, clockwise, so 50% lands dead centre top -->
    <path id="blueMain"
          d="M 450,450 m 0,320 a 320,320 0 1 1 0,-640 a 320,320 0 1 1 0,640" fill="none"/>

    <!-- bottom arc, counter-clockwise so the glyphs sit upright -->
    <path id="blueBot" d="M 450,450 m -330,0 a 330,330 0 0 0 660,0" fill="none"/>

    <!-- banner arc inside the gold, above the jets -->
    <path id="orgArc" d="M 450,450 m -246,0 a 246,246 0 0 1 492,0" fill="none"/>

    <radialGradient id="goldG" cx="42%" cy="34%" r="74%">
      <stop offset="0%"   stop-color="#DCBA6B"/>
      <stop offset="60%"  stop-color="#C9A24C"/>
      <stop offset="100%" stop-color="#B0893A"/>
    </radialGradient>

    <!-- one jet, nose up, origin at its own centre -->
    <g id="jet">
      <path d="M 0,-46
               C 4.5,-40 7,-28 7.6,-15
               L 36,2 L 36,11 L 7.6,4
               L 7.0,20 L 15,30 L 15,37 L 0,32 L -15,37 L -15,30 L -7.0,20
               L -7.6,4 L -36,11 L -36,2 L -7.6,-15
               C -7,-28 -4.5,-40 0,-46 Z"
            fill="#1C3F94"/>
    </g>
  </defs>

  <!-- ================= RINGS ================= -->
  <circle cx="450" cy="450" r="448" fill="#1C3F94"/>
  <circle cx="450" cy="450" r="441" fill="#CE1126"/>
  <circle cx="450" cy="450" r="371" fill="#FFFFFF"/>
  <circle cx="450" cy="450" r="366" fill="#1C3F94"/>
  <circle cx="450" cy="450" r="286" fill="#FFFFFF"/>
  <circle cx="450" cy="450" r="280" fill="url(#goldG)"/>
  <circle cx="450" cy="450" r="280" fill="none" stroke="#8E6E2A" stroke-width="2" opacity=".5"/>

  <!-- ================= RED BAND ================= -->
  <text font-family="Oswald" font-weight="600" font-size="31" fill="#FFFFFF"
        letter-spacing="5" text-anchor="middle">
    <textPath href="#redTop" startOffset="50%">AFFILIATED WITH</textPath>
  </text>
  <text font-family="Oswald" font-weight="600" font-size="24" fill="#FFFFFF"
        letter-spacing="1.9" text-anchor="middle">
    <textPath href="#redBot" startOffset="50%">AMERICAN FEDERATION OF REMOTE WORK &amp; CONGRESS OF UNLIMITED PAID TIME OFF</textPath>
  </text>

  <!-- ================= BLUE BAND ================= -->
  <text font-family="Oswald" font-weight="700" font-size="58" fill="#FFFFFF"
        letter-spacing="2.4" text-anchor="middle">
    <textPath href="#blueMain" startOffset="50%">INTERNATIONAL BROTHERHOOD OF EPHEMERAL WORKERS</textPath>
  </text>

  <text x="258" y="726" text-anchor="middle" font-family="Oswald" font-weight="600"
        font-size="27" fill="#FFFFFF" letter-spacing="2.6" transform="rotate(-27 258 726)">OUT OF</text>
  <text x="642" y="726" text-anchor="middle" font-family="Oswald" font-weight="600"
        font-size="27" fill="#FFFFFF" letter-spacing="2.6" transform="rotate(27 642 726)">OFFICE</text>

  <!-- ================= CENTRE ================= -->
  <!-- faint flight-path ring -->
  <circle cx="450" cy="450" r="214" fill="none" stroke="#1C3F94"
          stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14" opacity=".4"/>

  <!-- jets, tucked inside the banner arc -->
  <g>
    <g transform="translate(450,450) rotate(40)   translate(0,-186) scale(.76)"><use href="#jet"/></g>
    <g transform="translate(450,450) rotate(-40)  translate(0,-186) scale(.76)"><use href="#jet"/></g>
    <g transform="translate(450,450) rotate(72)   translate(0,-192) scale(.70)"><use href="#jet"/></g>
    <g transform="translate(450,450) rotate(-72)  translate(0,-192) scale(.70)"><use href="#jet"/></g>
    <g transform="translate(450,450) rotate(104)  translate(0,-196) scale(.64)"><use href="#jet"/></g>
    <g transform="translate(450,450) rotate(-104) translate(0,-196) scale(.64)"><use href="#jet"/></g>
    <g transform="translate(450,450) rotate(136)  translate(0,-198) scale(.58)"><use href="#jet"/></g>
    <g transform="translate(450,450) rotate(-136) translate(0,-198) scale(.58)"><use href="#jet"/></g>
  </g>

  <!-- banner -->
  <text font-family="Oswald" font-weight="700" font-size="30" fill="#1C3F94"
        letter-spacing="3" text-anchor="middle">
    <textPath href="#orgArc" startOffset="50%">ORGANIZED WHENEVER</textPath>
  </text>

  <!-- ---------- fist gripping a phone ---------- -->
  <g transform="translate(450,470)">
    <!-- phone rising out of the grip -->
    <g transform="translate(2,-104)">
      <rect x="-32" y="-72" width="64" height="120" rx="10"
            fill="#FFFFFF" stroke="#1C3F94" stroke-width="7"/>
      <rect x="-21" y="-60" width="42" height="92" rx="3" fill="#1C3F94" opacity=".14"/>
      <circle cx="0" cy="-65" r="3.4" fill="#1C3F94"/>
      <!-- sun + palm on the screen -->
      <circle cx="9" cy="-40" r="8.5" fill="#1C3F94" opacity=".55"/>
      <path d="M -14,4 C -14,-14 -5,-22 -3,-26 C -7,-22 -17,-20 -20,-15
               C -15,-19 -8,-19 -4,-26 C -2,-20 4,-18 8,-15
               C 4,-21 -2,-24 -3,-26"
            fill="none" stroke="#1C3F94" stroke-width="3.6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-4.6" y="-26" width="4.4" height="32" rx="2" fill="#1C3F94"/>
    </g>

    <!-- back of hand. The scalloped knuckle line is what stops this reading
         as a cylinder: four distinct bumps across the top. -->
    <path d="M -58,-38
             Q -43,-57 -28,-43  Q -13,-59 2,-45  Q 17,-59 32,-44  Q 46,-56 58,-37
             C 64,-13 66,11 62,33
             C 57,57 34,70 0,70
             C -34,70 -57,57 -62,33
             C -66,11 -64,-13 -58,-38 Z"
          fill="#FFFFFF" stroke="#1C3F94" stroke-width="7" stroke-linejoin="round"/>

    <!-- creases between the folded fingers, dipping at the right where the tips tuck under -->
    <g fill="none" stroke="#1C3F94" stroke-width="6" stroke-linecap="round">
      <path d="M -55,-16 C -24,-26 24,-26 55,-14"/>
      <path d="M -59,9   C -26,-1 26,-1 59,11"/>
      <path d="M -60,34  C -26,24 26,24 58,35"/>
    </g>

    <!-- thumb: elongated and horizontal across the lower fingers. A round thumb with a
         nail ellipse reads as a snail shell, so this one is tapered and nail-free. -->
    <path d="M -63,4
             C -85,2 -96,16 -91,29
             C -86,43 -68,49 -48,46
             C -28,43 -10,36 -15,21
             C -21,8 -41,6 -63,4 Z"
          fill="#FFFFFF" stroke="#1C3F94" stroke-width="7" stroke-linejoin="round"/>
    <!-- single crease along the thumb, plus the web where it meets the hand -->
    <path d="M -80,16 C -62,12 -40,16 -24,24"
          fill="none" stroke="#1C3F94" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -58,2 C -50,12 -47,26 -48,40"
          fill="none" stroke="#1C3F94" stroke-width="5" stroke-linecap="round"/>

    <!-- cuff -->
    <path d="M -62,62 L 60,62 L 53,112 L -55,112 Z"
          fill="#FFFFFF" stroke="#1C3F94" stroke-width="7" stroke-linejoin="round"/>
    <g stroke="#1C3F94" stroke-width="4.5" stroke-linecap="round">
      <path d="M -44,74 L -41,100"/><path d="M -20,74 L -19,100"/>
      <path d="M 2,74 L 2,100"/>
      <path d="M 24,74 L 23,100"/><path d="M 44,74 L 41,100"/>
    </g>
  </g>
</svg>
</body>
</html>
