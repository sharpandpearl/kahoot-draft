<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lehigh 1-AA Draft Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --ink:#14161C; --panel:#1D2029; --panel2:#252936; --line:#333949;
    --chalk:#F2EFE6; --muted:#8D94A6;
    --amber:#FFC72C; --amber-dim:#7A5F14;
    --ibanez:#E0564C; --ok:#4E9E6A;
    --display:'Oswald','Arial Narrow',sans-serif;
    --body:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--chalk);font-family:var(--body);
       font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
         border-bottom:2px solid var(--amber);padding-bottom:10px}
  .brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;
         text-transform:uppercase;line-height:1.1}
  .brand em{color:var(--amber);font-style:normal}
  .rnd{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;
       font-variant-numeric:tabular-nums}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
           color:var(--amber);font-weight:600}
  .prompt{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.22;
          text-wrap:balance;margin:6px 0 0}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;
         display:flex;flex-direction:column;gap:12px}

  textarea{width:100%;min-height:110px;resize:vertical;background:var(--panel2);color:var(--chalk);
           border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit}
  textarea:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  button{font:600 16px var(--body);border-radius:8px;border:1px solid var(--line);
         background:var(--panel2);color:var(--chalk);padding:13px 16px;cursor:pointer;
         min-height:48px;transition:transform .06s ease}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--amber);color:#1A1400;border-color:var(--amber)}
  button.primary:disabled{background:var(--amber-dim);color:#C9C0A4;border-color:transparent}
  button:disabled{opacity:.55;cursor:not-allowed}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .card{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
        border-radius:8px;padding:14px;display:flex;gap:12px;align-items:flex-start;
        font:400 16px var(--body);color:var(--chalk)}
  .card[aria-pressed="true"]{border-color:var(--amber);background:#2C2A1B}
  .card .pick{font-family:var(--mono);font-size:13px;color:var(--amber);min-width:16px}
  .card.mine{opacity:.5}
  .stack{display:flex;flex-direction:column;gap:8px}

  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;
       padding:11px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
  .row .who{display:flex;gap:10px;align-items:baseline;min-width:0}
  .row .pos{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:26px;
            font-variant-numeric:tabular-nums}
  .row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .pts{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--amber)}
  .row.locked{border-color:var(--amber-dim);background:#221E10}
  .row.locked .pts{color:var(--muted);font-size:12px}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--mono);font-size:12px;padding:4px 9px;border-radius:999px;
        border:1px solid var(--line);color:var(--muted)}
  .chip.done{border-color:var(--ok);color:var(--ok)}

  .timerbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .clock{font-family:var(--mono);font-weight:600;font-size:30px;color:var(--amber);
         font-variant-numeric:tabular-nums;line-height:1;min-width:2ch;text-align:right}
  .clock.urgent{color:var(--ibanez)}
  body.tv .clock{font-size:76px}
  body.tv .timerbar{border-bottom:1px solid var(--line);padding-bottom:14px}

  .note{color:var(--muted);font-size:14px}
  .big{font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:.02em}
  .votes{font-family:var(--mono);color:var(--amber);font-weight:600;white-space:nowrap;min-width:18px}
  .author{font-family:var(--mono);font-size:12px;color:var(--muted)}

  .hostbar{position:fixed;left:0;right:0;bottom:0;background:#0E1015;border-top:2px solid var(--amber);
           padding:10px;display:flex;gap:8px;overflow-x:auto;justify-content:center}
  .hostbar button{font-size:14px;padding:10px 14px;min-height:44px;white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---- TV MODE: laptop screenshared to a television, read from a couch ---- */
  body.tv .wrap{max-width:1400px;padding:28px 40px 110px}
  body.tv .brand{font-size:34px}
  body.tv .rnd{font-size:20px}
  body.tv .eyebrow{font-size:17px;letter-spacing:.2em}
  body.tv .prompt{font-size:clamp(38px,5.2vw,72px);line-height:1.1}
  body.tv .panel{padding:28px;gap:20px}
  body.tv .note{font-size:22px}
  body.tv .big{font-size:38px}
  body.tv .chip{font-size:20px;padding:8px 16px}
  body.tv .card{font-size:30px;padding:20px 24px;gap:20px;align-items:center}
  body.tv .votes{font-size:44px;min-width:64px;text-align:right}
  body.tv .author{font-size:20px}
  body.tv .row{padding:16px 22px}
  body.tv .row .pos{font-size:24px;min-width:52px}
  body.tv .row .nm{font-size:30px}
  body.tv .row .pts{font-size:30px}
  body.tv .hostbar button{font-size:19px;padding:14px 22px;min-height:56px}
  /* two columns once there are a dozen answers to show at once */
  body.tv .stack.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:900px){body.tv .stack.split{grid-template-columns:1fr}}
  .joinurl{font-family:var(--mono);color:var(--amber);font-size:clamp(24px,3.4vw,44px);
           word-break:break-all;line-height:1.25}
  .waiting{font-family:var(--mono);color:var(--muted);font-size:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Lehigh 1-AA <em>Draft Night</em></div>
    <div class="rnd" id="rnd"></div>
  </header>
  <div id="app"><div class="panel"><div class="note">Connecting&hellip;</div></div></div>
</div>
<div class="hostbar" id="hostbar" hidden></div>

<script>
var MEMBERS = ["Kofi White","Clint Botway","Michael Airosus","Steven Shuldman","Jack Meehan",
  "JJ Woolley","Scott Pender","Tim DeVaney","Megan McLoughlin","Steven Erbrick",
  "Joe Mangenelli","Tony DiNardo"];
var QS = new URLSearchParams(location.search);
var HOSTKEY = QS.get("host");
var TV = QS.has("tv");            // laptop -> television: read-only big screen
if (TV) document.body.classList.add("tv");
var JOINURL = location.origin;
var app = document.getElementById("app");
var hostbar = document.getElementById("hostbar");
var me = { id: localStorage.getItem("pid"), name: localStorage.getItem("pname") };
var picks = [], last = "", busy = false;
var entryOrder = [], entryMode = false;   // host: entering Kahoot placements

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function api(p, b){
  var opts = b ? {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)} : undefined;
  return fetch("/api" + p, opts).then(function(r){ return r.json(); });
}

function join(name){
  return api("/join", { name: name }).then(function(r){
    if (r.id){ me = {id:r.id, name:r.name};
      localStorage.setItem("pid",r.id); localStorage.setItem("pname",r.name); last=""; tick(); }
  });
}

function joinScreen(){
  var btns = MEMBERS.map(function(n){
    return '<button data-name="'+esc(n)+'">'+esc(n)+'</button>'; }).join("");
  return '<div class="panel"><div class="eyebrow">Step 1</div>'
    + '<div class="big">Who are you?</div>'
    + '<div class="names">' + btns + '</div>'
    + '<div class="note">Pick your name to claim your seat. Refreshing keeps it.</div></div>';
}

function chipsFor(s, ids){
  return '<div class="chips">' + s.players.map(function(p){
    return '<span class="chip'+(ids.indexOf(p.id)>=0?" done":"")+'">'+esc(p.name)+'</span>';
  }).join("") + '</div>';
}

// Combine two leaderboards by PLACEMENT, not raw score: Kahoot pays ~1000 a
// question and this game pays 100 a vote, so summing raw points would let the
// trivia decide everything. Finishing 1st in either game is worth N points.
function combined(s){
  var n = s.players.length;
  var q = s.players.map(function(p){ return {id:p.id, name:p.name, pts:s.scores[p.id]||0}; })
           .sort(function(a,b){ return b.pts-a.pts; });
  var qRank = {}, kRank = {};
  q.forEach(function(p,i){ qRank[p.id] = i+1; });
  (s.kahoot||[]).forEach(function(id,i){ kRank[id] = i+1; });

  return s.players.map(function(p){
    var qr = qRank[p.id] || n, kr = kRank[p.id] || n;
    return { id:p.id, name:p.name, pts:s.scores[p.id]||0, qr:qr, kr:kr,
             total: (n - qr + 1) + (n - kr + 1) };
  }).sort(function(a,b){
    if (b.total !== a.total) return b.total - a.total;
    return a.kr - b.kr;                       // tie goes to the better Kahoot finish
  });
}

// Host-only: tap names in Kahoot finishing order, 1st first.
function kahootEntry(s){
  var chosen = entryOrder.slice();
  var remaining = s.players.filter(function(p){ return chosen.indexOf(p.id) < 0; });
  var nameOf = function(id){
    for (var i=0;i<s.players.length;i++) if (s.players[i].id===id) return s.players[i].name;
    return "?"; };
  return '<div class="panel"><div class="eyebrow">Kahoot finishing order</div>'
    + '<div class="note">Tap names in the order they finished the Kahoot &mdash; winner first. '
    + chosen.length+' of '+s.players.length+' placed.</div>'
    + '<div class="stack">' + chosen.map(function(id,i){
        return '<div class="row"><div class="who"><span class="pos">'+String(i+1).padStart(2,"0")
          + '</span><span class="nm">'+esc(nameOf(id))+'</span></div></div>'; }).join("")
    + '</div>'
    + (remaining.length
        ? '<div class="names">' + remaining.map(function(p){
            return '<button data-place="'+p.id+'">'+esc(p.name)+'</button>'; }).join("") + '</div>'
        : '')
    + '<div class="names"><button data-entry="undo">Undo last</button>'
    + '<button class="primary" data-entry="save">Save order</button></div></div>';
}

// The television. Never shows an input, never shows an unrevealed author,
// and always shows the join URL until everyone is in.
function renderTV(s, total){
  function board(){
    return s.players.map(function(p){ return {id:p.id,name:p.name,pts:s.scores[p.id]||0}; })
      .sort(function(a,b){ return b.pts-a.pts; });
  }
  function standings(list, offset, locked){
    return '<div class="stack">'
      + (locked ? '<div class="row locked"><div class="who"><span class="pos">01</span>'
          + '<span class="nm">'+esc(locked.name)+'</span></div>'
          + '<span class="pts">Waffle House</span></div>' : '')
      + list.map(function(p,ix){
          return '<div class="row"><div class="who"><span class="pos">'
            + String(ix+offset).padStart(2,"0")+'</span><span class="nm">'+esc(p.name)+'</span></div>'
            + '<span class="pts">'+p.pts+'</span></div>';
        }).join("") + '</div>';
  }

  if (s.phase === "lobby")
    return '<div class="panel"><div class="eyebrow">Join on your phone</div>'
      + '<div class="joinurl">'+esc(JOINURL.replace(/^https?:\/\//,""))+'</div>'
      + '<div class="note">Open it, tap your name. '+total+' of 12 in.</div>'
      + chipsFor(s, s.players.map(function(p){return p.id;})) + '</div>';

  if (s.phase === "write")
    return '<div class="panel">'
      + '<div class="timerbar"><span class="eyebrow">Round '+(s.round+1)+' of '+s.totalRounds+'</span>'
      + '<span class="clock" id="clock">30</span></div>'
      + '<div class="prompt">'+esc(s.prompt)+'</div>'
      + '<div class="waiting">'+s.submitted.length+' of '+total+' answers in</div>'
      + chipsFor(s, s.submitted) + '</div>';

  if (s.phase === "vote")
    return '<div class="panel"><div class="eyebrow">Vote on your phone</div>'
      + '<div class="prompt">'+esc(s.prompt)+'</div>'
      + '<div class="stack split">' + (s.cards||[]).map(function(c){
          return '<div class="card"><span>'+esc(c.text)+'</span></div>'; }).join("")
      + '</div><div class="waiting">'+s.voted.length+' of '+total+' voted</div>'
      + chipsFor(s, s.voted) + '</div>';

  if (s.phase === "scores")
    return '<div class="panel"><div class="eyebrow">Round '+(s.round+1)+' results</div>'
      + '<div class="prompt">'+esc(s.prompt)+'</div>'
      + '<div class="stack">' + (s.cards||[]).map(function(c){
          return '<div class="card"><span class="votes">'+c.votes+'</span><span>'+esc(c.text)
            + '<br><span class="author">'+esc(c.author)+'</span></span></div>'; }).join("")
      + '</div></div>'
      + '<div class="panel"><div class="eyebrow">Standings</div>'
      + standings(board(), 1, null) + '</div>';

  if (s.phase === "final"){
    var hasK = (s.kahoot||[]).length > 0;
    var b = hasK ? combined(s) : board(), locked = null, rest = [];
    for (var k=0;k<b.length;k++){
      if (!locked && /shuldman/i.test(b[k].name)) locked = b[k]; else rest.push(b[k]);
    }
    var rows = '<div class="stack">'
      + (locked ? '<div class="row locked"><div class="who"><span class="pos">01</span>'
          + '<span class="nm">'+esc(locked.name)+'</span></div>'
          + '<span class="pts">Waffle House</span></div>' : '')
      + rest.map(function(p,ix){
          return '<div class="row"><div class="who"><span class="pos">'
            + String(ix+(locked?2:1)).padStart(2,"0")+'</span><span class="nm">'+esc(p.name)+'</span></div>'
            + '<span class="pts">'+(hasK ? p.total + ' <span class="author">K'+p.kr+' &middot; Q'+p.qr+'</span>' : p.pts)
            + '</span></div>'; }).join("")
      + '</div>';
    return '<div class="panel"><div class="eyebrow">Final &middot; selection order</div>'
      + '<div class="note">The order you pick your draft slot. Not the slot itself.'
      + (hasK ? ' Kahoot placing plus this game, equally weighted.' : '') + '</div>'
      + rows + '</div>';
  }
  return '<div class="panel"><div class="note">&hellip;</div></div>';
}

function render(s){
  var total = s.players.length, i;
  document.getElementById("rnd").textContent =
    s.phase === "lobby" ? total + " joined"
    : s.phase === "final" ? "Final"
    : "Round " + (s.round+1) + " / " + s.totalRounds;

  if (entryMode && s.phase === "final") return kahootEntry(s);
  if (TV) return renderTV(s, total);

  var seated = false;
  for (i=0;i<s.players.length;i++) if (s.players[i].id === me.id) seated = true;
  if (!me.id || !seated) return joinScreen();

  if (s.phase === "lobby")
    return '<div class="panel"><div class="eyebrow">Waiting room</div>'
      + '<div class="big">You are in, '+esc(me.name)+'.</div>'
      + '<div class="note">Six prompts. Everyone answers, everyone votes for their two favourites. '
      + 'Each vote is worth 100 points. You cannot vote for yourself.</div>'
      + chipsFor(s, s.players.map(function(p){return p.id;})) + '</div>';

  if (s.phase === "write"){
    if (s.you.answered)
      return '<div class="panel"><div class="eyebrow">Locked in</div>'
        + '<div class="prompt">'+esc(s.prompt)+'</div>'
        + '<div class="row"><div class="who"><span class="nm">'+esc(s.you.text)+'</span></div></div>'
        + '<div class="note">Waiting for the rest.</div></div>';
    return '<div class="panel">'
      + '<div class="timerbar"><span class="eyebrow">Round '+(s.round+1)+' &middot; your answer</span>'
      + '<span class="clock" id="clock">30</span></div>'
      + '<div class="prompt">'+esc(s.prompt)+'</div>'
      + '<textarea id="ans" maxlength="200" placeholder="Make it count."></textarea>'
      + '<button class="primary" id="send">Submit answer</button></div>';
  }

  if (s.phase === "vote"){
    if (s.you.voted)
      return '<div class="panel"><div class="eyebrow">Vote cast</div>'
        + '<div class="big">Nice. Sit tight.</div>' + chipsFor(s, s.voted) + '</div>';
    var cards = (s.cards||[]).map(function(c){
      var on = picks.indexOf(c.id) >= 0;
      return '<button class="card'+(c.mine?" mine":"")+'" data-vote="'+c.id+'"'
        + (c.mine?" disabled":"") + ' aria-pressed="'+(on?"true":"false")+'">'
        + '<span class="pick">'+(on?"&#10003;":"&nbsp;")+'</span><span>'+esc(c.text)
        + (c.mine?' <span class="author">(yours)</span>':'')+'</span></button>';
    }).join("");
    return '<div class="panel"><div class="eyebrow">Pick your two favourites</div>'
      + '<div class="prompt">'+esc(s.prompt)+'</div>'
      + '<div class="stack">' + cards + '</div>'
      + '<button class="primary" id="castvote"'+(picks.length?"":" disabled")+'>Cast '
      + (picks.length||0)+' vote'+(picks.length===1?"":"s")+'</button></div>';
  }

  if (s.phase === "scores" || s.phase === "final"){
    var board = s.players.map(function(p){
      return { id:p.id, name:p.name, pts: s.scores[p.id]||0 }; })
      .sort(function(a,b){ return b.pts - a.pts; });
    var html = "";

    if (s.phase === "scores"){
      html += '<div class="panel"><div class="eyebrow">Round '+(s.round+1)+' results</div>'
        + '<div class="prompt">'+esc(s.prompt)+'</div><div class="stack">'
        + (s.cards||[]).map(function(c){
            return '<div class="card"><span class="votes">'+c.votes+'</span><span>'
              + esc(c.text)+'<br><span class="author">'+esc(c.author)+'</span></span></div>';
          }).join("")
        + '</div></div>'
        + '<div class="panel"><div class="eyebrow">Standings</div><div class="stack">'
        + board.map(function(p,ix){
            return '<div class="row"><div class="who"><span class="pos">'
              + String(ix+1).padStart(2,"0")+'</span><span class="nm">'+esc(p.name)+'</span></div>'
              + '<span class="pts">'+p.pts+'</span></div>';
          }).join("")
        + '</div></div>';
      return html;
    }

    // Final: Shuldman holds selection #1 by MAGA MARALAGO, everyone else fills 2 through 12.
    var hasK = (s.kahoot||[]).length > 0;
    if (hasK) board = combined(s);
    var locked = null, rest = [];
    for (var k=0;k<board.length;k++){
      if (!locked && /shuldman/i.test(board[k].name)) locked = board[k];
      else rest.push(board[k]);
    }
    html += '<div class="panel"><div class="eyebrow">Final &middot; selection order</div>'
      + '<div class="note">The order you pick your draft slot. Not the slot itself.</div>'
      + '<div class="stack">'
      + (locked ? '<div class="row locked"><div class="who"><span class="pos">01</span>'
          + '<span class="nm">'+esc(locked.name)+'</span></div>'
          + '<span class="pts">Waffle House</span></div>' : '')
      + rest.map(function(p,ix){
          return '<div class="row"><div class="who"><span class="pos">'
            + String(ix + (locked?2:1)).padStart(2,"0")+'</span><span class="nm">'+esc(p.name)
            + '</span></div><span class="pts">'
            + (hasK ? p.total+' <span class="author">K'+p.kr+' &middot; Q'+p.qr+'</span>' : p.pts)
            + '</span></div>';
        }).join("")
      + '</div></div>';
    return html;
  }
  return '<div class="panel"><div class="note">&hellip;</div></div>';
}

function hostControls(s){
  if (HOSTKEY !== "roofcondom"){ hostbar.hidden = true; return; }
  hostbar.hidden = false;
  function b(a,l){ return '<button data-host="'+a+'">'+l+'</button>'; }
  var main =
      s.phase==="lobby"  ? b("start","Start round 1")
    : s.phase==="write"  ? b("vote","Open voting")
    : s.phase==="vote"   ? b("scores","Show results")
    : s.phase==="scores" ? b("next","Next round") + b("final","End &amp; final order")
    : s.phase==="final"  ? b("kahoot", entryMode ? "Back to order" : "Enter Kahoot results")
    : "";
  // Reset stays reachable from every phase - a practice game has to be
  // clearable before the real one, and confirm() guards a misclick.
  hostbar.innerHTML = main + b("reset","Reset");
}

// Countdown lives OUTSIDE render(): rewriting innerHTML every second would
// destroy the textarea a player is typing into. Only the clock's text changes.
var deadlineAt = 0, autoSent = false;

function paintClock(){
  var el = document.getElementById("clock");
  if (!el || !deadlineAt) return;
  var left = Math.max(0, Math.ceil((deadlineAt - Date.now())/1000));
  el.textContent = left;
  el.classList.toggle("urgent", left <= 10);
  if (left === 0 && !autoSent){
    var ta = document.getElementById("ans");
    var v = ta ? ta.value.trim() : "";
    autoSent = true;
    if (v) api("/answer", { id: me.id, text: v }).then(function(){ last=""; tick(); });
  }
}
setInterval(paintClock, 250);

function tick(){
  if (busy) return Promise.resolve();
  return api("/state?id=" + encodeURIComponent(me.id || "")).then(function(s){
    hostControls(s);
    if (s.phase === "write"){ deadlineAt = Date.now() + s.remaining; }
    else { deadlineAt = 0; autoSent = false; }

    // A player's in-progress typing must survive any re-render, so the
    // signature deliberately omits other people's submissions on a phone.
    var sig = TV
      ? JSON.stringify([s.phase,s.round,s.submitted,s.voted,s.players.length,s.cards,s.scores,s.kahoot])
      : JSON.stringify([s.phase,s.round,s.players.length,s.you,picks,entryMode,entryOrder,s.kahoot,
                        s.phase==="vote" && !s.you.voted ? null : s.voted,
                        s.phase==="write" ? null : s.cards]);

    if (sig !== last){
      var ta = document.getElementById("ans");
      var keep = ta ? ta.value : null;
      var focused = ta && document.activeElement === ta;
      var caret = focused ? ta.selectionStart : 0;
      last = sig; app.innerHTML = render(s);
      var ta2 = document.getElementById("ans");
      if (ta2 && keep !== null){
        ta2.value = keep;
        if (focused){ ta2.focus(); try{ ta2.setSelectionRange(caret,caret); }catch(e){} }
      }
      paintClock();
    }
  }).catch(function(){ /* transient, next tick retries */ });
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-name],[data-vote],[data-host],[data-place],[data-entry],#send,#castvote");
  if (!t) return;

  if (t.dataset.place){ entryOrder.push(t.dataset.place); last=""; return tick(); }
  if (t.dataset.entry === "undo"){ entryOrder.pop(); last=""; return tick(); }
  if (t.dataset.entry === "save"){
    busy = true;
    return api("/host", { key: HOSTKEY, action: "setkahoot", order: entryOrder }).then(function(){
      entryMode = false; busy = false; last = ""; tick(); });
  }
  if (t.dataset.name) return join(t.dataset.name);
  if (t.dataset.host === "kahoot"){ entryMode = !entryMode; last=""; return tick(); }
  if (t.dataset.host){
    if (t.dataset.host === "reset" &&
        !confirm("Wipe the game? Clears every player and all scores.")) return;
    busy = true;
    return api("/host", { key: HOSTKEY, action: t.dataset.host }).then(function(){
      picks = []; busy = false; last = ""; tick(); });
  }
  if (t.id === "send"){
    var v = document.getElementById("ans").value.trim();
    if (!v) return;
    busy = true;
    return api("/answer", { id: me.id, text: v }).then(function(){ busy=false; last=""; tick(); });
  }
  if (t.dataset.vote){
    var id = t.dataset.vote, at = picks.indexOf(id);
    if (at >= 0) picks.splice(at,1);
    else if (picks.length < 2) picks.push(id);
    last = ""; return tick();
  }
  if (t.id === "castvote"){
    busy = true;
    return api("/vote", { id: me.id, picks: picks }).then(function(){
      picks = []; busy = false; last=""; tick(); });
  }
});

tick(); setInterval(tick, 1500);
</script>
