  #   - "Who has the most all-time regular season wins?"      (4 manager names)
  #   - "Which manager has made the playoffs the most times?" (4 manager names)
  #   - "Who drafted <notorious bust> in round 1?"            (4 manager names)
  #   - "Largest margin of victory ever recorded?"            (4 point ranges)
  #   - "Who has the most all-time trades?"                   (4 manager names)
  #   - "Which manager has NEVER made the playoffs?"          (4 manager names)
  #
